[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vcoc"
dynamic = ["version"]
description = "Verifiable chain of custody for digital evidence files"
requires-python = ">=3.10"
dependencies = ["ecdsa>=0.19", "cryptography>=42.0", "prompt_toolkit>=3.0"]

[project.scripts]
vcoc = "vcoc.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "vcoc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
